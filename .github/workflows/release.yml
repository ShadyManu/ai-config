name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/vscode/**
      - package.json
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

      - name: Audit dependencies
        run: pnpm audit

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run extension integration tests
        run: xvfb-run --auto-servernum pnpm test:vscode

      - name: Package extension
        run: pnpm package

      - name: Pack CLI
        run: |
          mkdir -p release
          npm pack ./packages/cli --pack-destination ./release

      - name: Validate npm package
        run: npm publish ./release/aiconfig-cli-*.tgz --access public --dry-run

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            ai-config.vsix
            release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish CLI to npm
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Publish CLI
        run: npm publish ./release-packages/release/aiconfig-cli-*.tgz --access public

  publish-vscode:
    name: Publish extension to Visual Studio Marketplace
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.0 publish --packagePath ./release-packages/ai-config.vsix --skip-duplicate

  publish-open-vsx:
    name: Publish extension to Open VSX
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.1.1 publish ./release-packages/ai-config.vsix
