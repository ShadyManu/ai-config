name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate aligned versions
        run: node scripts/check-release-tag.mjs

      - name: Check whether this version was released
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version $version is already marked as released; nothing to publish."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is new and will be published."
          fi

  build:
    name: Build release artifacts
    if: needs.plan.outputs.should_release == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run extension integration tests
        run: xvfb-run --auto-servernum pnpm test:vscode

      - name: Package extension
        run: pnpm package

      - name: Pack CLI
        run: |
          mkdir -p release
          npm pack ./packages/cli --pack-destination ./release

      - name: Validate npm package
        run: npm publish ./release/aiconfig-cli-*.tgz --access public --dry-run

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            ai-config.vsix
            release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish CLI to npm
    needs:
      - plan
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Check whether the CLI version already exists
        id: npm-version
        shell: bash
        run: |
          if npm view "@aiconfig/cli@${{ needs.plan.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@aiconfig/cli@${{ needs.plan.outputs.version }} is already on npm; skipping it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish ./release-packages/release/aiconfig-cli-*.tgz --access public

  publish-vscode:
    name: Publish extension to Visual Studio Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT repository secret is not configured."
            exit 1
          fi
          npx --yes @vscode/vsce@3.9.0 publish --packagePath ./release-packages/ai-config.vsix --skip-duplicate

  publish-open-vsx:
    name: Publish extension to Open VSX
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The OVSX_PAT repository secret is not configured."
            exit 1
          fi
          npx --yes ovsx@1.1.1 publish ./release-packages/ai-config.vsix --skip-duplicate

  tag-release:
    name: Tag successful release
    needs:
      - plan
      - publish-npm
      - publish-vscode
      - publish-open-vsx
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "AI Config $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
